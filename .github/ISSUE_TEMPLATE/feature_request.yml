name: Feature request
description: A new feature or an improvement to an existing one
labels: [enhancement, needs-discussion]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, interaction or behavior you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
