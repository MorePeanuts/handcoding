name: CI

on:
  push:
    # Maintenance branches (v0.1.x) receive cherry-picks onto older code,
    # which main's CI never tested.
    branches: [main, "v*.x"]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes its running checks. Pushes to main and
# maintenance branches always finish, since any of them may be tagged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Solutions run on the oldest Python the problem protocol supports
        # (python.MinVersion) and on the latest. The oldest Go is checked by
        # TestGoMinimumVersion with the toolchain that builds hc.
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.x" }
          - { os: macos-latest, python: "3.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # go vet runs once, as part of golangci-lint in the lint job.
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so CI and `make lint` agree; bump together.
          version: v2.15.0
