name: CI

on:
  push:
    # Maintenance branches (v0.1.x) receive cherry-picks onto older code,
    # which main's CI never tested.
    branches: [main, "v*.x"]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes its running checks. Pushes to main and
# maintenance branches always finish, since any of them may be tagged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Exercise the protocol minimums on both supported platforms.
        # C11/C++17 and Go 1.22 are checked by the tests themselves;
        # GCC on Linux and Clang on macOS cover both compiler families.
        os: [ubuntu-latest, macos-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.0.0"
      - run: npm install --global --ignore-scripts typescript@5.7.3
      # setup-uv publishes no major-version tags since v8.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-13 gdb pkg-config libglib2.0-dev
      - if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/hc-tools"
          ln -s /usr/bin/g++-13 "$RUNNER_TEMP/hc-tools/g++"
          echo "$RUNNER_TEMP/hc-tools" >> "$GITHUB_PATH"
      - if: runner.os == 'macOS'
        run: brew install pkgconf glib
      # go vet runs once, as part of golangci-lint in the lint job.
      # Each integration test may launch a native compiler. Bound both
      # package and test concurrency so they do not oversubscribe the runner.
      - run: make test TEST_FLAGS='-p=2 -parallel=2'
        env:
          # make test sets it too: a missing or too old tool fails the tests
          # instead of skipping them.
          HC_TEST_REQUIRE_TOOLS: "1"
          HC_TEST_REQUIRE_GLIB: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so CI and `make lint` agree; bump together.
          version: v2.15.0
