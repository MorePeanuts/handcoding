name: CI

on:
  push:
    branches: [main, "v*.x"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch: # Explicit full validation of the selected ref.

defaults:
  run:
    shell: bash # pipefail must propagate go test failures through tee.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      unit: ${{ steps.plan.outputs.unit }}
      lint: ${{ steps.plan.outputs.lint }}
      integration: ${{ steps.plan.outputs.integration }}
      regression: ${{ steps.plan.outputs.regression }}
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.0.0"
      - run: node --test .github/scripts/*.test.cjs
      - id: plan
        run: node .github/scripts/test-plan.cjs

  test:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      HC_TEST_REQUIRE_TOOLS: "1"
      HC_TEST_REQUIRE_GLIB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go modules
        uses: actions/cache@v5
        with:
          path: ${{ steps.go-cache.outputs.modules }}
          key: hc-test-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Restore test build cache
        id: test-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: hc-test-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hc-test-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-
      # The minimum protocol versions, on both compiler/OS families.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.0.0"
      - run: npm install --global --ignore-scripts typescript@5.7.3
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-13 gdb pkg-config libglib2.0-dev
      - if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/hc-tools"
          ln -s /usr/bin/g++-13 "$RUNNER_TEMP/hc-tools/g++"
          echo "$RUNNER_TEMP/hc-tools" >> "$GITHUB_PATH"
      - if: runner.os == 'macOS'
        run: brew install pkgconf glib
      # Keep app's timing-sensitive tests isolated, then overlap at most two
      # integration packages with two active tests each. Never cache verdicts.
      - name: Base tests (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.unit == 'true'
        run: make test-unit TEST_FLAGS='-count=1 -p=4 -parallel=4 -json' | tee test-unit.jsonl
      - name: Platform base tests (macOS)
        if: runner.os == 'macOS' && needs.plan.outputs.unit == 'true'
        run: make test-unit TEST_FLAGS='-count=1 -p=4 -parallel=4 -json' | tee test-unit.jsonl
        env:
          TEST_PACKAGES: ./internal/git ./internal/workspace ./internal/store ./internal/termimg
      - name: Selected integration tests
        if: needs.plan.outputs.integration != ''
        run: make test-integration TEST_FLAGS='-count=1 -parallel=4 -json' | tee test-integration.jsonl
        env:
          TEST_PACKAGES: ${{ needs.plan.outputs.integration }}
          TEST_PACKAGE_JOBS: "2"
          TEST_PACKAGE_PARALLEL: "2"
      - name: Selected regression tests
        if: needs.plan.outputs.regression == 'true'
        run: make test-regression TEST_FLAGS='-count=1 -p=1 -parallel=4 -json' | tee test-regression.jsonl
        env:
          HC_TEST_SELECTION: ${{ needs.plan.outputs.selection }}
      - name: Test timing summary
        if: always()
        run: node .github/scripts/test-report.cjs test-unit.jsonl test-integration.jsonl test-regression.jsonl
      # Unlike setup-go's immutable dependency-only key, each successful run
      # publishes newly compiled race/non-race objects for subsequent runs.
      # Lint owns a separate cache; only build objects, never verdicts, are reused.
      - name: Save test build cache
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.test-cache.outputs.cache-primary-key }}

  lint:
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  result:
    name: CI result
    if: always()
    needs: [plan, test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.0.0"
      - run: node .github/scripts/check-results.cjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
