name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history
      - name: Require CI success for the tagged commit
        uses: actions/github-script@v9
        with:
          script: |
            // Resolve HEAD so annotated tags are checked by commit, not tag object.
            const { stdout } = await exec.getExecOutput('git', ['rev-parse', 'HEAD']);
            const sha = stdout.trim();
            const requireCI = require('./.github/scripts/require-ci.cjs');
            const run = await requireCI({ github, ...context.repo, sha });
            core.notice(`CI passed for ${sha}: ${run.html_url}`);
            await core.summary.addHeading('Release CI gate')
              .addLink(`CI passed for ${sha}`, run.html_url).write();
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
