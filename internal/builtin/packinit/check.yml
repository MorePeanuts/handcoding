# Checks the pack on every push and pull request. Written by `hc pack init`.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build hc with a current Go, then select the protocol minimum below
      # for reference execution. No cache: a pack has no go.sum to key it by.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # The oldest Python the protocol supports: the pack's references and
      # checkers must run on it.
      - uses: actions/setup-python@v7
        with:
          python-version: "<% .Python %>"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --global --ignore-scripts typescript@5.7.3
      - name: Install C/C++ compilers and optional GLib
        run: sudo apt-get update && sudo apt-get install -y gcc-13 g++-13 pkg-config libglib2.0-dev
<%- if .Pinned %>
      # The hc the pack is checked with. Bump it on purpose: read what changed
      # with `hc docs protocol protocol-versions`, then run `hc skill install`
      # and commit the refreshed skills with the bump.
<%- else %>
      # The hc the pack is checked with. `hc pack init` ran on a development
      # build of hc, so this is the latest release: pin it to one (@vX.Y.Z).
      # Bump it on purpose: read what changed with
      # `hc docs protocol protocol-versions`, then run `hc skill install` and
      # commit the refreshed skills with the bump.
<%- end %>
      - name: Install hc
        run: go install github.com/MorePeanuts/handcoding/cmd/hc@<% .Version %>
      # pack check runs on the selected tools, without a second compatibility
      # compilation. CI owns the minimum-version environment.
      - uses: actions/setup-go@v7
        with:
          go-version: "<% .Go %>.x"
          cache: false
      - name: Select strict C/C++ compilers
        run: |
          mkdir -p "$RUNNER_TEMP/hc-tools"
          printf '#!/bin/sh\nexec gcc-13 -pedantic-errors "$@"\n' > "$RUNNER_TEMP/hc-tools/hc-cc"
          printf '#!/bin/sh\nexec g++-13 -pedantic-errors "$@"\n' > "$RUNNER_TEMP/hc-tools/hc-cxx"
          chmod +x "$RUNNER_TEMP/hc-tools/hc-cc" "$RUNNER_TEMP/hc-tools/hc-cxx"
          echo "$RUNNER_TEMP/hc-tools" >> "$GITHUB_PATH"
      # hc.yaml is not committed (.gitignore): it holds the settings of a
      # checkout, here the Python set up above instead of a virtual
      # environment of hc's.
      - name: Configure hc
        run: |
          printf 'python:\n  interpreter: python3\nc:\n  command: hc-cc\n  standard: c11\ncpp:\n  command: hc-cxx\n  standard: c++17\n' > hc.yaml
      - name: Check the pack
        run: hc pack check
      # --force: the committed copies of hc's skills must be exactly the
      # pinned hc's, edits included. Keep your own notes in CLAUDE.md or in a
      # skill of your own, which hc never touches.
      - name: Check that the committed skills are the pinned hc's
        run: |
          hc skill install --force
          git add --intent-to-add -- AGENTS.md .claude .agents
          git diff --exit-code -- AGENTS.md .claude .agents || {
            echo "::error::The committed skills differ from those of the pinned hc: run \`hc skill install\` and commit the result."
            exit 1
          }
